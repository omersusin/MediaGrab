name: MediaGrab CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Ensure Gradle Wrapper (jar + scripts)
        run: |
          echo "Generating wrapper via system Gradle in isolated project..."
          mkdir -p /tmp/wgen/gradle/wrapper
          echo 'rootProject.name = "wgen"' > /tmp/wgen/settings.gradle.kts
          touch /tmp/wgen/build.gradle.kts
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin --project-dir /tmp/wgen
          cp /tmp/wgen/gradlew ./gradlew
          cp /tmp/wgen/gradlew.bat ./gradlew.bat
          cp /tmp/wgen/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          echo "--- Wrapper files ---"
          ls -la gradlew gradlew.bat gradle/wrapper/
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Upload Signed Release APK
        if: steps.sign_app.outputs.signedReleaseFile != ''
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Release-Signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
