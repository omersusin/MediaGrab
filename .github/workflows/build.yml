name: MediaGrab CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper (jar + scripts)
        run: |
          chmod +x gradlew || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, generating wrapper..."
            # Use setup-gradle's gradle if available, fallback to ./gradlew
            if command -v gradle &> /dev/null; then
              gradle wrapper --gradle-version 8.10.2 --distribution-type bin
            else
              echo "ERROR: gradle not found on PATH and wrapper jar is missing"
              echo "Please commit gradle/wrapper/gradle-wrapper.jar to the repository"
              exit 1
            fi
          fi
          chmod +x gradlew
          echo "--- Wrapper files ---"
          ls -la gradlew gradlew.bat gradle/wrapper/ || true

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Upload Signed Release APK
        if: steps.sign_app.outputs.signedReleaseFile != ''
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Release-Signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
